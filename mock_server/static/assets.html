<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>资产列表 - 中台资产管理平台</title>
  <style>
    body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; color: #1f2329; }
    header { background: #3370ff; color: #fff; padding: 16px 32px; }
    h1 { margin: 0; font-size: 22px; }
    nav { padding: 12px 32px; border-bottom: 1px solid #e5e6eb; }
    nav a { margin-right: 24px; color: #3370ff; text-decoration: none; }
    main { padding: 24px 32px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #e5e6eb; padding: 8px 12px; text-align: left; }
    th { background: #f5f6f7; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
    .running { background: #e1eaff; color: #3370ff; }
    .maintain { background: #fff3e0; color: #b26a00; }
    .stopped { background: #f2f3f5; color: #646a73; }
  </style>
</head>
<body>
  <header>
    <h1>资产列表</h1>
  </header>
  <nav>
    <a href="/index.html">首页</a>
    <a href="/assets.html">资产列表</a>
    <a href="/import.html">资产导入</a>
  </nav>
  <main>
    <input id="search" type="text" placeholder="按资产名称搜索...">
    <table id="asset-table">
      <thead>
        <tr><th>资产ID</th><th>资产名称</th><th>类型</th><th>状态</th></tr>
      </thead>
      <tbody>
        <tr><td>AST-1001</td><td>核心交换机-SW-01</td><td>网络设备</td><td><span class="badge running">运行中</span></td></tr>
        <tr><td>AST-1002</td><td>办公笔记本-LT-1024</td><td>终端设备</td><td><span class="badge running">运行中</span></td></tr>
        <tr><td>AST-1003</td><td>数据库服务器-DB-03</td><td>服务器</td><td><span class="badge maintain">维护中</span></td></tr>
        <tr><td>AST-1004</td><td>打印机-PR-08</td><td>办公设备</td><td><span class="badge stopped">已停用</span></td></tr>
        <tr><td>AST-1005</td><td>防火墙-FW-02</td><td>网络设备</td><td><span class="badge running">运行中</span></td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
